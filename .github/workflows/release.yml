name: Build and publish release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf 'storeFile=%s\n' "$RUNNER_TEMP/release.keystore" > keystore.properties
          printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD" >> keystore.properties
          printf 'keyAlias=%s\n' "$KEY_ALIAS" >> keystore.properties
          printf 'keyPassword=%s\n' "$KEY_PASSWORD" >> keystore.properties

      - name: Build signed APK
        run: ./gradlew :app:assembleFdroidRelease --no-daemon

      - name: Rename APK
        run: mv app/build/outputs/apk/fdroid/release/app-fdroid-release.apk open-swap-${{ github.ref_name }}.apk

      - name: Print fingerprint
        run: $ANDROID_HOME/build-tools/*/apksigner verify --print-certs open-swap-${{ github.ref_name }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          files: open-swap-${{ github.ref_name }}.apk
          generate_release_notes: true
