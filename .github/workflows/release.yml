name: Build and publish release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    # Existing-tag refreshes must not trigger a competing release upload.
    if: github.event.created == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      apk_sha256: ${{ steps.metadata.outputs.apk_sha256 }}
      version: ${{ steps.metadata.outputs.version }}
      build: ${{ steps.metadata.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Test wallet routing, approvals and authentication
        run: >-
          ./gradlew :walletkit:testDebugUnitTest
          --tests '*Relay*Test'
          --tests '*Pancake*Test'
          --tests '*Approval*Test'
          --tests '*PinConfirm*Test'
          --tests '*ConfirmPinPageTest'
          --tests '*LockGateTest'
          --tests '*OpenSwapProviderRatingsTest'
          --tests '*SwapProviderIdMappingTest'
          --no-daemon

      - name: Build unsigned F-Droid release without production credentials
        run: |
          test ! -e keystore.properties
          ./gradlew :app:assembleFdroidRelease -PunsignedRelease=true --no-daemon

      - name: Verify distribution, source and immutable artifact
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, shutil, zipfile
          from pathlib import Path
          tag = os.environ["RELEASE_TAG"]
          assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag), "Unexpected release tag"
          metadata = json.loads(Path("app/build/outputs/apk/fdroid/release/output-metadata.json").read_text())
          assert metadata["variantName"] == "fdroidRelease"
          assert metadata["applicationId"] == "money.openswap.wallet"
          assert len(metadata["elements"]) == 1
          built = metadata["elements"][0]
          assert built["versionName"] == tag[1:]
          source = Path("app/build.gradle.kts").read_text()
          assert built["versionCode"] == int(re.search(r"(?m)^\s*versionCode\s*=\s*(\d+)", source).group(1))
          config = Path("app/build/generated/source/buildConfig/fdroid/release/io/horizontalsystems/bankwallet/BuildConfig.java").read_text()
          assert "FDROID_BUILD = true;" in config
          apk = Path("app/build/outputs/apk/fdroid/release") / built["outputFile"]
          with zipfile.ZipFile(apk) as archive:
              vcs = archive.read("META-INF/version-control-info.textproto").decode()
              assert re.search(r'^\s*revision:\s*"([0-9a-f]{40})"\s*$', vcs, re.M).group(1) == os.environ["SOURCE_COMMIT"], "APK source revision mismatch"
          directory = Path("release-artifacts")
          directory.mkdir()
          shutil.copyfile(apk, directory / "unsigned.apk")
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"apk_sha256={digest}\nversion={built['versionName']}\nbuild={built['versionCode']}\n")
          PY
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify release-artifacts/unsigned.apk; then
            echo 'Build unexpectedly contains a signature'; exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-fdroid
          path: release-artifacts/unsigned.apk
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: build
    outputs:
      apk_sha256: ${{ steps.signature.outputs.apk_sha256 }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # No source checkout, Gradle, build cache or repository scripts run on this runner.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-fdroid
          path: unsigned
      - name: Verify input and align before exposing signing credentials
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.apk_sha256 }}
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          EXPECTED_BUILD: ${{ needs.build.outputs.build }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, os, re, subprocess, zipfile
          from pathlib import Path
          apk = Path("unsigned/unsigned.apk")
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == os.environ["EXPECTED_SHA256"], "Artifact changed between jobs"
          tools = Path(os.environ["ANDROID_HOME"]) / "build-tools/36.0.0"
          text = subprocess.check_output([str(tools / "aapt"), "dump", "badging", str(apk)], text=True)
          package = next(line for line in text.splitlines() if line.startswith("package: "))
          assert "name='money.openswap.wallet'" in package
          assert f"versionName='{os.environ['EXPECTED_VERSION']}'" in package
          assert f"versionCode='{os.environ['EXPECTED_BUILD']}'" in package
          assert "application-debuggable" not in text
          with zipfile.ZipFile(apk) as archive:
              vcs = archive.read("META-INF/version-control-info.textproto").decode()
              assert re.search(r'^\s*revision:\s*"([0-9a-f]{40})"\s*$', vcs, re.M).group(1) == os.environ["SOURCE_COMMIT"]
          PY
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -P 16 -f 4 unsigned/unsigned.apk aligned.apk

      - name: Sign and verify, then destroy temporary credentials
        id: signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keyfile=$(mktemp "$RUNNER_TEMP/release-key.XXXXXX")
          trap 'rm -f -- "$keyfile"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$keyfile"
          unset KEYSTORE_BASE64
          mkdir signed
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$keyfile" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out signed/wallet.apk aligned.apk
          rm -f -- "$keyfile"
          unset KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs signed/wallet.apk > "$RUNNER_TEMP/apk-signing.txt"
          python3 - "$RUNNER_TEMP/apk-signing.txt" <<'PY'
          import hashlib, os, re, sys
          from pathlib import Path
          digests = {value.lower() for value in re.findall(r"certificate SHA-256 digest:\s*([0-9a-fA-F]{64})\b", Path(sys.argv[1]).read_text())}
          assert digests == {"277c10bbed425c98b8df4aa7372dfe483daeefdc6ddbc19b462ac83df8d8b295"}, "Unexpected release signing certificate"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("apk_sha256=" + hashlib.sha256(Path("signed/wallet.apk").read_bytes()).hexdigest() + "\n")
          PY
          # The EXIT trap removes the key on success and failure, before another action runs.

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-fdroid
          path: signed/wallet.apk
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-fdroid
          path: signed
      - name: Publish with verified annotated-tag notes
        env:
          EXPECTED_SHA256: ${{ needs.sign.outputs.apk_sha256 }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          gh api "repos/$GH_REPO/git/tags/$tag" > tag.json
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          assert hashlib.sha256(Path("signed/wallet.apk").read_bytes()).hexdigest() == os.environ["EXPECTED_SHA256"], "Signed artifact changed between jobs"
          tag = json.loads(Path("tag.json").read_text())
          assert tag["tag"] == os.environ["RELEASE_TAG"]
          assert tag["object"]["type"] == "commit" and tag["object"]["sha"] == os.environ["SOURCE_COMMIT"], "Release tag moved after building"
          Path("RELEASE_NOTES.md").write_text(tag["message"])
          PY
          mv signed/wallet.apk "open-swap-$RELEASE_TAG.apk"
          gh release create "$RELEASE_TAG" "open-swap-$RELEASE_TAG.apk" --verify-tag --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
