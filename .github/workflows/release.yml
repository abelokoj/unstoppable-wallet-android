name: Build and publish release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # Existing-tag refreshes publish a verified APK without a competing rebuild.
    if: github.event.created == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test wallet routing and scan animations
        run: >-
          ./gradlew :walletkit:testDebugUnitTest
          --tests '*Pancake*Test'
          --tests '*ApprovalScanningAnimationTest'
          --tests '*OpenSwapProviderRatingsTest'
          --tests '*SwapProviderIdMappingTest'
          --no-daemon

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.keystore"
          ls -l "$RUNNER_TEMP/release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KEYSTORE_PASSWORD" | head -5

      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf 'storeFile=%s\n' "$RUNNER_TEMP/release.keystore" > keystore.properties
          printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD" >> keystore.properties
          printf 'keyAlias=%s\n' "$KEY_ALIAS" >> keystore.properties
          printf 'keyPassword=%s\n' "$KEY_PASSWORD" >> keystore.properties

      - name: Build signed F-Droid APK
        run: ./gradlew :app:assembleFdroidRelease --no-daemon

      - name: Verify F-Droid distribution
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          metadata = json.loads(Path("app/build/outputs/apk/fdroid/release/output-metadata.json").read_text())
          assert metadata["variantName"] == "fdroidRelease"
          assert metadata["applicationId"] == "money.openswap.wallet"
          assert len(metadata["elements"]) == 1
          built = metadata["elements"][0]
          assert built["versionName"] == os.environ["GITHUB_REF_NAME"].removeprefix("v"), "APK version does not match release tag"
          source = Path("app/build.gradle.kts").read_text()
          source_build = int(re.search(r"(?m)^\s*versionCode\s*=\s*(\d+)", source).group(1))
          assert built["versionCode"] == source_build, "APK build number does not match source"
          config = Path("app/build/generated/source/buildConfig/fdroid/release/io/horizontalsystems/bankwallet/BuildConfig.java").read_text()
          assert "FDROID_BUILD = true;" in config
          PY

      - name: Rename APK
        run: mv app/build/outputs/apk/fdroid/release/app-fdroid-release.apk open-swap-${{ github.ref_name }}.apk

      - name: Verify release signing identity
        run: |
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs open-swap-${{ github.ref_name }}.apk > "$RUNNER_TEMP/apk-signing.txt"
          cat "$RUNNER_TEMP/apk-signing.txt"
          grep -F "Signer #1 certificate SHA-256 digest: 277c10bbed425c98b8df4aa7372dfe483daeefdc6ddbc19b462ac83df8d8b295" "$RUNNER_TEMP/apk-signing.txt"

      - name: Release notes from the annotated tag
        run: git tag -l --format='%(contents)' "${{ github.ref_name }}" > RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          files: open-swap-${{ github.ref_name }}.apk
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
