:root{color-scheme:light dark}body{font-family:system-ui,sans-serif;background:light-dark(#f2f2f3,#101012);color:light-dark(#202022,#e8e8eb);margin:0;padding:24px}h1{font-size:22px;font-weight:500;margin:0 0 8px}body>p{margin:0 0 28px;font-size:14px;color:light-dark(#626268,#a6a6ac)}#tom-jerry-ground-search .viz-carousel{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,350px),1fr));gap:22px;counter-reset:option}#tom-jerry-ground-search section{counter-increment:option;min-width:0}#tom-jerry-ground-search section::before{content:attr(data-label);display:block;font-size:15px;font-weight:500;margin-bottom:6px}#tom-jerry-ground-search .motion-stage{min-height:338px;padding:8px 0;gap:14px}#tom-jerry-ground-search .scan-page{border-radius:10px}button{cursor:pointer}
</style></head><body><h1>Tom and Jerry searching the ground</h1><p>Full classic character bodies, each holding a magnifying glass and searching the same little patch of earth. Press Play to watch.</p><div id="tom-jerry-ground-search">
  <style>
    #tom-jerry-ground-search { color-scheme:light dark; }
    #tom-jerry-ground-search .motion-stage { min-height:414px; display:grid; align-content:start; justify-items:center; gap:16px; padding:18px 12px; box-sizing:border-box; }
    #tom-jerry-ground-search .scan-page { width:min(100%,420px); min-height:330px; padding:24px; box-sizing:border-box; border-radius:12px; background:light-dark(#fff,#171717); color:light-dark(#808087,#a5a5ab); display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:system-ui,sans-serif; text-align:center; }
    #tom-jerry-ground-search .scan-page p { font-size:16px; line-height:24px; font-weight:400; margin:0 0 8px; }
    #tom-jerry-ground-search canvas { display:block; width:min(100%,320px); height:auto; aspect-ratio:3/2; }
    #tom-jerry-ground-search .motion-play { min-height:44px; padding:8px 16px; border:1px solid light-dark(#dadade,#434348); border-radius:8px; color:light-dark(#252527,#ebebee); background:light-dark(#f6f6f7,#262629); font:400 14px/20px system-ui,sans-serif; }
    #tom-jerry-ground-search .motion-play:focus-visible { outline:2px solid light-dark(#215ac7,#8cafff); outline-offset:3px; }
  </style>
  <div class="motion-stage viz-dotted-background" aria-label="Full-body Tom and Jerry searching the ground with magnifying glasses">
    <div class="scan-page" role="status"><p>Checking permissions…</p><canvas width="600" height="400" aria-hidden="true"></canvas></div>
    <button type="button" class="motion-play cursor-interaction" aria-pressed="false">Play animation</button>
  </div>
  <script>
    (() => {
      const root=document.getElementById('tom-jerry-ground-search');
      const canvas=root.querySelector('canvas'),ctx=canvas.getContext('2d');
      const layer=document.createElement('canvas');layer.width=600;layer.height=400;
      const target=layer.getContext('2d');
      const button=root.querySelector('button');
      const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
      const image=new Image();
      const crop={"x":0,"y":56,"width":256,"height":181};
      let playing=false,frameId=0,start=null;

      function frameBlend(elapsed) {
        const position=((elapsed%2400)+2400)%2400/300;
        const first=Math.floor(position),progress=position-first;
        return {first,next:(first+1)%8,mix:progress*progress*(3-2*progress)};
      }

      function draw(elapsed) {
        ctx.setTransform(2,0,0,2,0,0);ctx.clearRect(0,0,300,200);
        if(!image.complete || !image.naturalWidth) return;
        target.setTransform(2,0,0,2,0,0);target.clearRect(0,0,300,200);
        const blend=frameBlend(elapsed);
        const cellW=image.naturalWidth/4,cellH=image.naturalHeight/2;
        const scale=Math.min(280/crop.width,176/crop.height);
        const width=crop.width*scale,height=crop.height*scale;
        const x=(300-width)/2,y=108-height/2;
        const paint=(index,alpha)=>{
          target.globalAlpha=alpha;
          target.drawImage(image,(index%4)*cellW+crop.x,Math.floor(index/4)*cellH+crop.y,
            crop.width,crop.height,x,y,width,height);
        };
        target.globalCompositeOperation='source-over';paint(blend.first,1-blend.mix);
        target.globalCompositeOperation='lighter';paint(blend.next,blend.mix);
        target.globalAlpha=1;target.globalCompositeOperation='source-over';
        ctx.drawImage(layer,0,0,300,200);
      }

      function stop() {
        playing=false;start=null;cancelAnimationFrame(frameId);
        button.textContent='Play animation';button.setAttribute('aria-pressed','false');draw(0);
      }
      function tick(now) {
        if(!playing) return;
        if(start===null) start=now;
        const elapsed=now-start;
        if(elapsed>=14400 || reducedMotion.matches){stop();return;}
        draw(elapsed);frameId=requestAnimationFrame(tick);
      }
      button.addEventListener('click',()=>{
        if(playing){stop();return;}
        if(reducedMotion.matches) return;
        playing=true;start=null;button.textContent='Stop preview';button.setAttribute('aria-pressed','true');
        frameId=requestAnimationFrame(tick);
      });
      reducedMotion.addEventListener('change',stop);
